[package]
name = "herdr-open-in"
version = "0.4.1"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
description = "herdr plugin that opens the current workspace in the editor you pick"

[dependencies]
anyhow = "1.0.104"
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[dev-dependencies]
mockall = "0.15.0"
