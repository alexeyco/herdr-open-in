# Manifest reference: https://herdr.dev/docs/plugins/
id = "alexeyco.open-in"
name = "Open in"
version = "0.4.1"
min_herdr_version = "0.9.0"
description = "Opens the current herdr workspace in the editor you pick"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[panes]]
id = "picker"
title = "Open in"
placement = "popup"
width = 38
height = 16
command = ["./target/release/herdr-open-in"]

[[panes]]
id = "editor"
title = "Editor"
placement = "tab"
command = ["./target/release/herdr-open-in"]

[[actions]]
id = "open"
title = "Open in editor"
description = "Picks an editor and opens the workspace directory in it"
contexts = ["workspace"]
command = ["./target/release/herdr-open-in"]
